ue);box-shadow:0 0 0 2px var(--blue)}.pin.start{left:10%;background:var(--mint);box-shadow:0 0 0 2px var(--mint)}.pin.end{left:84%}.truck{position:absolute;left:55%;top:55%;width:25px;height:25px;border-radius:50%;background:#13213a;border:5px solid white;box-shadow:0 0 0 2px #13213a;animation:drive 3s ease-in-out infinite alternate}@keyframes drive{to{left:68%}}.maplabel{position:absolute;top:78%;font-size:12px;color:#63738a;font-weight:700;letter-spacing:.08em}.maplabel.a{left:8%}.maplabel.b{right:7%}.toast{position:absolute;right:30px;bottom:26px;padding:15px 18px;background:#fff;border:1px solid #e3e9f0;border-radius:13px;box-shadow:0 12px 35px #1526411a;color:#24334b;animation:toast 2.5s ease-in-out infinite}@keyframes toast{0%,100%{transform:translateY(8px);opacity:.4}20%,80%{transform:none;opacity:1}}.phone{position:absolute;left:1180px;top:165px;width:390px;height:750px;border:8px solid #0c1522;background:#fff;border-radius:48px;box-shadow:0 35px 100px #050a1399;color:var(--ink);padding:22px;animation:float 4.5s ease-in-out infinite}.notch{height:22px;width:120px;background:#0c1522;border-radius:0 0 18px 18px;margin:-22px auto 27px}.phonebrand{font-size:14px;letter-spacing:.12em;font-weight:700}.routebox{margin-top:26px;padding:21px;background:#f3f6fa;border-radius:17px}.routebox small,.podbox small{display:block;color:#718099;font-size:12px;margin-bottom:10px}.routebox strong{font-size:24px}.phone .mobilepill{display:inline-block;margin-top:17px;padding:9px 13px;border-radius:30px;background:#e8f5f0;color:#19886e;font-size:12px;font-weight:700}.phone .map{height:200px;margin-top:20px}.podbox{margin-top:20px;padding:17px;background:#f0f4f8;border-radius:14px}.podbox b{color:#19886e;font-size:17px}.button{margin-top:18px;padding:15px 12px;text-align:center;border-radius:12px;background:var(--blue);color:white;font-weight:700;font-size:13px}.steps{position:absolute;left:135px;top:620px;display:flex;gap:13px}.step{border:1px solid #33435b;background:#18263a;bor <body><main class="stage" id="stage"><div class="grain"></div><div class="brandline">BNB <b>·</b> TRANSPORT SaaS <span style="opacity:.45">/ PRODUCT FILM</span></div><div id="scenes"></div><div class="scene-indicator" id="counter"></div></main>
<script>
const scenes=[
 {eyebrow:'01 / OPERACIONES CONECTADAS',title:'Toda la operación.<br>En un solo flujo.',desc:'Pedidos, equipos y entregas coordinados de principio a fin.',track:['CLIENTE','OPERACIONES','CONDUCTOR'],ui:'',duration:4},
 {eyebrow:'02 / PEDIDO',title:'Del email a la operación.',desc:'La automatización extrae, valida y crea el servicio.',track:['PEDIDO','SERVICIO','ASIGNACIÓN'],ui:'inbox',duration:4},
 {eyebrow:'03 / CONTROL Y TRACKING',title:'Visibilidad para decidir.',desc:'Estado, responsable y ETA actualizados en tiempo real.',track:['EN RUTA','ETA 12:40','VALENCIA → MADRID'],ui:'dashboard',duration:4},

 {eyebrow:'05 / AUTOMATIZACIÓN',title:'Menos tareas. Más control.',desc:'El POD validado prepara el servicio para facturación.',track:['ENTREGA','VERIFICACIÓN','FACTURA'],ui:'workflow',duration:4},
 {eyebrow:'06 / IDENTIDAD',title:'Transporte conectado.<br>Operación inteligente.',desc:'',track:[],ui:'logo',duration:4}
];
function track(items){return `<div class="track">${items.map((x,i)=>`${i?'<i class="connector"></i>':''}<span class="pill">${x}</span>`).join('')}</div>`}
function frame(ui,i){if(ui==='logo')return `<div class="mark"><svg viewBox="0 0 100 100" fill="none"><path d="M20 50H43M57 50H80" stroke="white" stroke-width="5" stroke-linecap="round"/><circle cx="20" cy="50" r="7" fill="#B7F2D8"/><circle cx="50" cy="50" r="19" fill="white"/><circle cx="50" cy="50" r="7" fill="#22A17D"/><circle cx="80" cy="50" r="7" fill="#B7F2D8"/></svg></div><div class="endtitle">Transporte conectado.<br>Operación inteligente.</div><div class="endlabel">SÍMBOLO CONCEPTUAL · NOMBRE POR DEFINIR</div><div class="endbrand">BNB / TRANSPORT SaaS</div>`;
 if(ui==='phone')return `<div class="phone"><div class="notch"></div><div class="phonebrand">BNB / CONDUCTOR</div><span class="mobilepill">● &nbsp; EN RUTA</span><div class="routebox"><small>DESTINO</small><strong>Mercadona Demo</strong><p style="color:#718099">Valencia → Madrid</p></div><div class="map"><i class="route"></i><i class="pin start"></i><i class="pin end"></i><i class="truck"></i></div><div class="podbox"><small>PRUEBA DE ENTREGA</small><b>✓ &nbsp; POD recibido</b></div><div class="button">ENTREGA CONFIRMADA</div></div>`;
 if(ui==='workflow')return `<div class="workflow"><h3>CONTROL DE FACTURACIÓN</h3><div class="wfrow"><span>1 · Entrega confirmada</span><span>✓</span></div><div class="wfrow"><span>2 · POD verificado</span><span>✓</span></div><div class="wfrow"><span>3 · Listo para facturar</span><span>✓</span></div><div class="amount">1.250 €<small>TR-10483 · importe demo</small></div></div>`;
 let isInbox=ui==='inbox';return `<section class="window"><header class="topbar"><span>▰ &nbsp; BNB &nbsp; / &nbsp; OPERACIONES</span><span class="status"><i class="live"></i> Datos de demo · sincronizado</span></header><div class="content"><div class="winhead">${isInbox?'Pedido convertido en servicio':'Servicios activos'}</div><div class="winsub">${isInbox?'TR-10483 · validación automática':'Resumen de operación · hoy'}</div>${isInbox?`<div class="cards"><div class="card"><small>CLIENTE</small><strong style="font-size:22px">Mercadona Demo</strong><em>Valencia → Madrid</em></div><div class="card"><small>CARGA</small><strong style="font-size:22px">18.500 kg</strong><em>Alimentación</em></div><div class="card"><small>SERVICIO CREADO</small><strong style="font-size:22px">TR-10483</strong><em>✓ Datos validados</em></div></div><div class="map" style="height:330px;background:linear-gradient(90deg,#f2f5f8 1px,transparent 1px),linear-gradient(#f2f5f8 1px,transparent 1px),#fff;background-size:45px 45px"><div style="position:absolute;inset:40px;display:grid;place-items:center;font-size:26px;color:#24334b">PEDIDO PDF &nbsp; → &nbsp; SERVICIO &nbsp; → &nbsp; CONDUCTOR</div><div class="toast">✓ &nbsp; Servicio creado automáticamente</div></div>`:`<div class="cards"><div class="card"><small>EN RUTA</small><strong>24</strong><em>+6 hoy</em></div><div class="card"><small>POD PENDIENTES</small><strong>03</strong><em style="color:#b67a18">2 requieren acción</em></div><div class="card"><small>LISTOS PARA FACTURAR</small><strong>18</strong><em>Documentación OK</em></div></div><div class="map"><i class="route"></i><i class="pin start"></i><i class="pin end"></i><i class="truck"></i><span class="maplabel a">VALENCIA</span><span class="maplabel b">MADRID · ETA 12:40</span><div class="toast">TR-10483 &nbsp; · &nbsp; Mercadona Demo &nbsp; · &nbsp; En ruta</div></div>`}</div></section>`}
function render(i){const s=scenes[i],html=`<article class="scene scene${i+1} ${i===0?'active':''}"><div class="left"><div class="eyebrow">${s.eyebrow}</div>${i<5?`<h1 class="title">${s.title}</h1><p class="desc">${s.desc}</p>`:''}</div>${i<5?`${frame(s.ui,i)}${track(s.track)}`:frame('logo',i)}</article>`;document.getElementById('scenes').insertAdjacentHTML('beforeend',html)}
scenes.forEach((_,i)=>render(i));let current=0;const fixed=location.hash.match(/scene=(\d+)/);if(fixed)current=Math.max(0,Math.min(5,+fixed[1]));function show(i){document.querySelectorAll('.scene').forEach((el,n)=>el.classList.toggle('active',n===i));document.getElementById('counter').textContent=`0${i+1} / 06`;current=i}show(current);if(!fixed)setInterval(()=>show((current+1)%scenes.length),4000);const stage=document.getElementById('stage');function fit(){const sc=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${sc})`}fit();addEventListener('resize',fit);
</script></body></html>
