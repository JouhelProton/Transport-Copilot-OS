services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transport_copilot
      POSTGRES_USER: transport_copilot
      POSTGRES_PASSWORD: transport_copilot_dev
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport_copilot -d transport_copilot"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - transport_copilot_pgdata:/var/lib/postgresql/data

volumes:
  transport_copilot_pgdata:
